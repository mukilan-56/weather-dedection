<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IoT Weather Station</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-temp: #f97316;
      --accent-humidity: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      background-color: #334155;
      color: var(--text-muted);
    }

    .status-badge.connected {
      background-color: #065f46;
      color: #34d399;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .card .icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    .card .label {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .card .value {
      font-size: 2.8rem;
      font-weight: 800;
    }

    .card.temp .value { color: var(--accent-temp); }
    .card.humidity .value { color: var(--accent-humidity); }

    .raw-debug {
      margin-top: 20px;
      background: #000;
      padding: 15px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.85rem;
      color: #38bdf8;
      word-break: break-all;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>IoT Weather Station</h1>
      <span id="connection-status" class="status-badge">Connecting...</span>
    </header>

    <main class="dashboard">
      <div class="card temp">
        <div class="icon">🌡️</div>
        <div class="label">Temperature</div>
        <div class="value"><span id="temp-val">--</span>°C</div>
      </div>

      <div class="card humidity">
        <div class="icon">💧</div>
        <div class="label">Humidity</div>
        <div class="value"><span id="humidity-val">--</span>%</div>
      </div>
    </main>

    <div class="raw-debug">
      <strong>Received Data from Firebase:</strong>
      <pre id="raw-data">Waiting for data...</pre>
    </div>

    <footer>
      Last updated: <span id="last-updated">Never</span>
    </footer>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBDUn68-1MiIUoR-XC0WNWxVPb3xER-ezs",
      authDomain: "iot-weather-application-5f7d4.firebaseapp.com",
      databaseURL: "https://iot-weather-application-5f7d4-default-rtdb.firebaseio.com",
      projectId: "iot-weather-application-5f7d4",
      storageBucket: "iot-weather-application-5f7d4.firebasestorage.app",
      messagingSenderId: "88968472378",
      appId: "1:88968472378:web:31c33d7a10d613abcb5203",
      measurementId: "G-GNHVW67Y1K"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const tempEl = document.getElementById("temp-val");
    const humidityEl = document.getElementById("humidity-val");
    const statusEl = document.getElementById("connection-status");
    const lastUpdatedEl = document.getElementById("last-updated");
    const rawDataEl = document.getElementById("raw-data");

    // Root ref to read everything
    const weatherRef = ref(db, '/');

    onValue(weatherRef, (snapshot) => {
      const data = snapshot.val();

      // Show exact data received in the black box
      rawDataEl.textContent = JSON.stringify(data, null, 2);

      if (data !== null) {
        statusEl.textContent = "Live Connected";
        statusEl.classList.add("connected");

        // Recursive search for temp & humidity in case nested under child nodes
        let temp = findValue(data, ["temperature", "temp", "Temperature", "Temp", "t"]);
        let hum = findValue(data, ["humidity", "hum", "Humidity", "Hum", "h"]);

        if (temp !== null) tempEl.textContent = temp;
        if (hum !== null) humidityEl.textContent = hum;

        lastUpdatedEl.textContent = new Date().toLocaleTimeString();
      } else {
        statusEl.textContent = "No Data Found in Database";
        statusEl.classList.remove("connected");
      }
    }, (error) => {
      console.error(error);
      statusEl.textContent = "Permission / Read Error";
      rawDataEl.textContent = "Error: " + error.message;
      statusEl.classList.remove("connected");
    });

    // Helper function to search keys dynamically
    function findValue(obj, keys) {
      if (typeof obj !== 'object' || obj === null) return null;
      for (let key of Object.keys(obj)) {
        if (keys.includes(key)) return obj[key];
        if (typeof obj[key] === 'object') {
          let res = findValue(obj[key], keys);
          if (res !== null) return res;
        }
      }
      return null;
    }
  </script>
</body>
</html>
